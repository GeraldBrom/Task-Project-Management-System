services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: tasks_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=tasks_db
      - DB_USERNAME=tasks_user
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tasks_network

  nginx:
    image: nginx:stable-alpine
    container_name: tasks_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tasks_network

  vite:
    image: node:20-alpine
    container_name: tasks_vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - tasks_network

  db:
    image: mysql:8.0
    container_name: tasks_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=tasks_db
      - MYSQL_USER=tasks_user
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root_secret
    ports:
      - "3306:3306"
    volumes:
      - tasks_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tasks_network

networks:
  tasks_network:
    driver: bridge

volumes:
  tasks_db_data:
    driver: local
